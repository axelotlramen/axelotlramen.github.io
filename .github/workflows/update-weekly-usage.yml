name: Weekly Character Usage Update

on:
  schedule:
    - cron: "0 12 * * 2" # Tuesdays, ~7 AM EST
  workflow_dispatch: # allows manual runs too

permissions:
  contents: write

jobs:
  weekly-usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install deps
        run: uv sync --locked

      - name: Write Google service account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Run weekly usage aggregation
        env:
          HOYOLAB_WEBHOOK: ${{ secrets.HOYOLAB_WEBHOOK }}
          DISCORD_ID: ${{ secrets.DISCORD_ID }}
          SHEET_CREDENTIALS: service_account.json
        run: uv run python -m scripts.update_usage

      - name: Commit updated usage CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/usage_overall.csv data/usage_by_endgame.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update weekly character usage stats"
            git push
          fi
