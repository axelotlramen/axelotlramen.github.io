<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>axelotlramen's Gacha Page — Endgame History</title>
    <link rel="icon" type="image/x-icon" href="/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="endgame">
    <!-- Sidebar -->
    <div class="sidebar">
      <h2 class="logo">Gacha</h2>
      <nav>
        <a href="/home/">Home</a>
        <a href="/hsr/">Honkai: Star Rail</a>
        <a href="/genshin/">Genshin Impact</a>
        <a href="/endfield/">Arknights: Endfield</a>
        <a href="/endgame/" aria-current="page">Endgame History</a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <h1>Endgame History</h1>

      <div class="endgame-filters">
        <div class="endgame-filter-row">
          <span class="endgame-filter-label">Mode</span>
          <div id="endgame-mode-filters" class="endgame-mode-filters"></div>
        </div>
        <div class="endgame-filter-row">
          <span class="endgame-filter-label">Boss</span>
          <input type="text" id="endgame-boss-filter" class="endgame-text-input" placeholder="Filter by boss name..." />
        </div>
        <div class="endgame-filter-row endgame-filter-row-characters">
          <span class="endgame-filter-label">Characters</span>
          <div class="endgame-character-filter">
            <input type="text" id="endgame-character-search" class="endgame-text-input" placeholder="Search characters..." />
            <div id="endgame-character-options" class="endgame-character-options"></div>
          </div>
        </div>
      </div>

      <div id="endgame-result-count" class="endgame-result-count"></div>

      <div id="endgame-results"></div>
    </div>

    <script src="/endgame/endgame.js"></script>
  </body>
</html>
