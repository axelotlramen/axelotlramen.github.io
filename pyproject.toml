[project]
name = "gacha-profile-viewer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx[brotli]",
    "genshin",
    "ramael",
    "cookies",
    "rsa",
    "openpyxl",
    "gspread",
    "google-auth",
    "pandas",
    "pydantic",
]

[tool.uv]
package = false

[tool.uv.sources]
genshin = { git = "https://github.com/seriaati/genshin.py", branch = "master" }

[dependency-groups]
dev = ["nox"]
lint = ["ruff"]
typecheck = ["pyright"]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
# Specifying `exclude` at all disables pyright's implicit default excludes (dot-dirs like
# .nox/.venv, __pycache__, etc.) - so those have to be listed explicitly alongside ours.
exclude = ["codebase_reviews", "**/.nox", "**/.venv", "**/__pycache__", "**/.git"]
