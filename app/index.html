<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>axelotlramen's Gacha Dashboard</title>
    <!--
      GitHub Pages has no server-side rewrite, so a direct hit to e.g. /hsr
      has no matching file. public/404.html encodes the requested path into
      a query string and redirects here; this decodes it back into a real
      history entry before React Router mounts. Standard "spa-github-pages"
      pattern (https://github.com/rafgraph/spa-github-pages).
    -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
